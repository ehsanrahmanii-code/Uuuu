name: Build TITAN Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check TITAN file
        run: |
          if [ ! -f "TITAN_PRO_V75_PWA.py" ]; then
            echo "ERROR: TITAN_PRO_V75_PWA.py not found!"
            exit 1
          fi
          echo "Found TITAN_PRO_V75_PWA.py ($(du -h TITAN_PRO_V75_PWA.py | cut -f1))"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip python3-venv \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev \
            gettext autopoint libgettextpo-dev \
            build-essential ccache

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "cython==0.29.36"
          pip install buildozer

      - name: Show Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Build APK with Buildozer
        run: |
          rm -rf .buildozer/android/platform/build-arm64-v8a || true
          buildozer -v android debug
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Dump gradle log on failure
        if: failure()
        run: |
          echo "=== Searching for gradle errors ==="
          find .buildozer -name "*.log" -o -name "build.gradle" 2>/dev/null | head -30 || true
          GRADLE_LOG=$(find .buildozer -path "*dists*" -name "*.log" 2>/dev/null | head -5)
          for f in $GRADLE_LOG; do echo "--- $f"; tail -80 "$f"; done || true
          # Also try to re-run gradle with more output if dist exists
          DIST=$(find .buildozer -type d -name titanpro 2>/dev/null | head -1)
          if [ -n "$DIST" ] && [ -f "$DIST/gradlew" ]; then
            echo "=== Re-running gradle for error details ==="
            cd "$DIST" && ./gradlew assembleDebug --stacktrace 2>&1 | tail -120 || true
          fi

      - name: Show built files
        if: always()
        run: |
          echo "=== bin/ contents ==="
          ls -lah bin/ || true
          find . -name "*.apk" -o -name "*.aab" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TITAN-Pro-APK
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: warn
          retention-days: 14
